<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nhân vật đứng</title>
<script type="module" src="https://cdn.jsdelivr.net/npm/@google/model-viewer@3.5.0/dist/model-viewer.min.js"></script>
<style>
  html, body { margin: 0; background: #2b2d31; color: #ddd; font-family: system-ui, sans-serif; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 10px; padding: 10px; }
  figure { margin: 0; background: #34363c; border-radius: 12px; overflow: hidden; }
  model-viewer { width: 100%; height: 420px; }
  figcaption { padding: 8px 12px; font-size: 13px; }
</style></head>
<body><div class="grid">
  <figure><model-viewer src="newMan1.glb" camera-controls auto-rotate shadow-intensity="1" exposure="1.1" environment-image="neutral"></model-viewer><figcaption>1 · Ông Ba Râu</figcaption></figure>
  <figure><model-viewer src="newMan2.glb" camera-controls auto-rotate shadow-intensity="1" exposure="1.1" environment-image="neutral"></model-viewer><figcaption>2 · Bác Tư Mũ Nồi</figcaption></figure>
  <figure><model-viewer src="newMan3.glb" camera-controls auto-rotate shadow-intensity="1" exposure="1.1" environment-image="neutral"></model-viewer><figcaption>3 · Chú Năm Hói</figcaption></figure>
  <figure><model-viewer src="newMan4.glb" camera-controls auto-rotate shadow-intensity="1" exposure="1.1" environment-image="neutral"></model-viewer><figcaption>4 · Ông Sáu Kính</figcaption></figure>
  <figure><model-viewer src="newMan5.glb" camera-controls auto-rotate shadow-intensity="1" exposure="1.1" environment-image="neutral"></model-viewer><figcaption>5 · Bác Bảy Cười</figcaption></figure>
</div></body></html>
